<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صندوقنا</title>
<meta name="theme-color" content="#064e3b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="صندوقنا">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>body{background:#f2f6f3;color:#0f2a20;font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<div id="root"></div>
<script>
const SB_URL = 'https://qagczlzmpaalgxjuthdm.supabase.co';
const SB_KEY = 'sb_publishable_mbu-UKqfJRcDWe8Tf4ov0w_TRzFkE-D';
const sb = supabase.createClient(SB_URL, SB_KEY);
const html = htm.bind(React.createElement);
const { useState, useEffect, useCallback } = React;

const MN = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const money = n => '$' + Number(n || 0).toLocaleString('en-US');
const STY = { paid: 'bg-emerald-600 text-white', late: 'bg-red-500 text-white', exempt: 'bg-yellow-300 text-yellow-900', pending: 'bg-orange-400 text-white' };
const LBL = { paid: '🟢 مدفوع', late: '🔴 متأخر', exempt: '🟡 معفي', pending: '🟠 مراجعة' };
const al = n => n === 1 ? 'شهر' : n === 2 ? 'شهرين' : n + (n <= 10 ? ' أشهر' : ' شهراً');
const form = ev => { ev.preventDefault(); return Object.fromEntries(new FormData(ev.target)); };
const Btn = ({ children, cls = 'bg-emerald-800 text-white', ...p }) => html`<button ...${p} className=${'px-3 py-1.5 rounded-lg text-sm font-medium ' + cls}>${children}</button>`;
const Inp = p => html`<input ...${p} className="w-full border rounded-lg p-2 bg-white"/>`;
const Card = ({ children, cls = '' }) => html`<div className=${'bg-white rounded-2xl shadow-sm border border-emerald-100 p-4 ' + cls}>${children}</div>`;
const arMsg = m => /Invalid login/i.test(m) ? 'البريد أو كلمة المرور غير صحيحة' : /already registered/i.test(m) ? 'هذا البريد مسجل مسبقاً' : /Email not confirmed/i.test(m) ? 'يجب تأكيد البريد من رسالة وصلتك' : /rate limit/i.test(m) ? 'محاولات كثيرة، انتظر قليلاً' : m;

let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; window.dispatchEvent(new Event('canInstall')); });
function Install() {
  const [can, setCan] = useState(!!deferredInstall);
  useEffect(() => { const f = () => setCan(true); window.addEventListener('canInstall', f); window.addEventListener('appinstalled', () => setCan(false)); return () => window.removeEventListener('canInstall', f); }, []);
  if (!can) return null;
  return html`<button className="text-sm bg-amber-400 text-emerald-950 font-bold rounded-lg px-2 py-1" onClick=${async () => { deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; setCan(false); }}>📲 تثبيت</button>`;
}
function App() {
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => data.subscription.unsubscribe();
  }, []);
  if (session === undefined) return html`<p className="p-10 text-center text-gray-500">جارٍ التحميل…</p>`;
  return session ? html`<${Funds} session=${session}/>` : html`<${Auth}/>`;
}

function Auth() {
  const [mode, setMode] = useState('in'), [msg, setMsg] = useState(''), [busy, setBusy] = useState(false);
  const submit = async ev => {
    const f = form(ev); setMsg(''); setBusy(true);
    const { data, error } = mode === 'in'
      ? await sb.auth.signInWithPassword({ email: f.email, password: f.password })
      : await sb.auth.signUp({ email: f.email, password: f.password, options: { data: { name: f.name } } });
    setBusy(false);
    if (error) return setMsg(arMsg(error.message));
    if (mode === 'up' && !data.session) setMsg('تم إنشاء الحساب. افتح رسالة التأكيد في بريدك ثم سجّل الدخول.');
  };
  return html`<form onSubmit=${submit} className="max-w-sm mx-auto mt-16 p-6 bg-white rounded-2xl shadow space-y-3">
    <h1 className="text-3xl font-extrabold text-emerald-900 text-center">🌿 صندوقنا</h1>
    <p className="text-center text-sm text-gray-500">إدارة الصناديق المشتركة بشفافية</p>
    ${mode === 'up' && html`<${Inp} name="name" placeholder="الاسم" required/>`}
    <${Inp} name="email" type="email" placeholder="البريد الإلكتروني" required/>
    <${Inp} name="password" type="password" minLength="6" placeholder="كلمة المرور (6 أحرف على الأقل)" required/>
    <button disabled=${busy} className="w-full py-2 rounded-lg bg-emerald-800 text-white font-bold disabled:opacity-50">${mode === 'in' ? 'دخول' : 'إنشاء حساب'}</button>
    <button type="button" className="w-full text-sm text-emerald-800 underline" onClick=${() => { setMode(mode === 'in' ? 'up' : 'in'); setMsg(''); }}>${mode === 'in' ? 'ليس لدي حساب' : 'لدي حساب بالفعل'}</button>
    ${msg && html`<p className="text-sm text-red-600">${msg}</p>`}
  </form>`;
}

function Funds({ session }) {
  const [funds, setFunds] = useState(null), [cur, setCur] = useState(null), [msg, setMsg] = useState('');
  const load = useCallback(async () => {
    const u = session.user;
    await sb.from('profiles').upsert({ id: u.id, name: (u.user_metadata && u.user_metadata.name) || u.email.split('@')[0] });
    const { data, error } = await sb.from('funds').select('*').order('created_at');
    if (error) setMsg(error.message);
    setFunds(data || []); setCur(c => c || (data && data[0] && data[0].id) || null);
  }, []);
  useEffect(() => { load(); }, [load]);
  const create = async ev => {
    const f = form(ev), el = ev.target; setMsg('');
    const { data, error } = await sb.from('funds').insert({ name: f.name, fee: +f.fee, due_day: +f.due, start_month: f.start + '-01' }).select().single();
    if (error) return setMsg(error.message);
    el.reset(); await load(); setCur(data.id);
  };
  const join = async ev => {
    const f = form(ev), el = ev.target; setMsg('');
    const { data, error } = await sb.rpc('join_fund', { p_code: f.code.trim() });
    if (error) return setMsg('رمز الدعوة غير صحيح');
    el.reset(); await load(); setCur(data);
  };
  if (!funds) return html`<p className="p-10 text-center text-gray-500">جارٍ التحميل…</p>`;
  const fund = funds.find(f => f.id === cur);
  const ym = new Date().toISOString().slice(0, 7);
  return html`<div className="max-w-4xl mx-auto pb-10">
    <header className="sticky top-0 z-40 bg-emerald-900 text-white p-3 flex flex-wrap gap-2 items-center shadow">
      <b className="text-amber-200 text-lg">🌿 صندوقنا</b>
      <select className="flex-1 min-w-[9rem] text-emerald-950 rounded-lg p-1.5 text-sm" value=${cur || ''} onChange=${e => setCur(e.target.value)}>${funds.map(f => html`<option key=${f.id} value=${f.id}>${f.name}</option>`)}</select>
      <${Install}/><button className="text-sm underline" onClick=${() => sb.auth.signOut()}>خروج</button>
    </header>
    ${msg && html`<p className="m-3 text-sm text-red-600">${msg}</p>`}
    ${fund ? html`<${Fund} key=${fund.id} fund=${fund} session=${session} reload=${load}/>` : html`<p className="p-8 text-center text-gray-500">لا توجد صناديق بعد. أنشئ صندوقك الأول أو انضم برمز دعوة 👇</p>`}
    <div className="grid md:grid-cols-2 gap-3 px-3 mt-6">
      <form onSubmit=${create} className="bg-white rounded-2xl p-4 shadow-sm space-y-2">
        <b>＋ صندوق جديد</b>
        <${Inp} name="name" placeholder="اسم الصندوق" required/>
        <${Inp} name="fee" type="number" min="1" placeholder="الاشتراك الشهري" required/>
        <${Inp} name="due" type="number" min="1" max="28" placeholder="يوم الاستحقاق (1-28)" required/>
        <label className="block text-xs text-gray-500">بداية احتساب الاشتراكات (الأشهر قبلها لا تُحسب متأخرة)<${Inp} name="start" type="month" defaultValue=${ym} required/></label>
        <button className="w-full py-2 rounded-lg bg-emerald-800 text-white">إنشاء</button>
      </form>
      <form onSubmit=${join} className="bg-white rounded-2xl p-4 shadow-sm space-y-2 self-start">
        <b>🔗 الانضمام برمز دعوة</b>
        <${Inp} name="code" placeholder="رمز الدعوة" required/>
        <button className="w-full py-2 rounded-lg bg-amber-400 text-emerald-950 font-bold">انضمام</button>
      </form>
    </div></div>`;
}

function Fund({ fund, session, reload }) {
  const [members, setMembers] = useState([]), [months, setMonths] = useState([]), [tx, setTx] = useState([]), [invs, setInvs] = useState([]);
  const [tab, setTab] = useState('mem'), [open, setOpen] = useState(null), [late, setLate] = useState(false), [msg, setMsg] = useState(''), [edit, setEdit] = useState(null), [etx, setEtx] = useState(null), [einv, setEinv] = useState(null);
  const uid = session.user.id;
  const me = members.find(m => m.user_id === uid), admin = me && me.role === 'admin';
  const load = useCallback(async () => {
    const m = await sb.from('fund_members').select('*').eq('fund_id', fund.id).order('display_name');
    const isA = (m.data || []).some(x => x.user_id === uid && x.role === 'admin');
    const [mm, t, iv] = await Promise.all([
      sb.from('member_months').select('*').eq('fund_id', fund.id).order('month'),
      sb.from(isA ? 'transactions' : 'transactions_public').select('*').eq('fund_id', fund.id),
      sb.from('investments').select('*').eq('fund_id', fund.id).order('name')]);
    setMembers(m.data || []); setMonths(mm.data || []); setTx(t.data || []); setInvs(iv.data || []);
    if (t.error) setMsg('تعذّر تحميل الحركات: ' + t.error.message);
  }, [fund.id]);
  useEffect(() => { load(); }, [load]);
  const run = async (p, ok) => { setMsg(''); const { error } = await p; if (error) setMsg(/overflow/i.test(error.message) ? 'القيمة المُدخلة كبيرة جداً — العائد المتوقع أقصاه 999%' : 'تعذّر التنفيذ: ' + error.message); else if (ok) setMsg(''); await load(); };
  const by = id => months.filter(x => x.member_id === id);
  const lateN = id => by(id).filter(x => x.status === 'late').length;
  const cycle = (m, r) => admin && run(sb.rpc('set_month', { p_member: m.id, p_month: r.month, p_status: r.status === 'late' || r.status === 'pending' ? 'paid' : r.status === 'paid' ? 'exempt' : null }));
  const payAll = m => run(sb.rpc('pay_months', { p_member: m.id, p_months: by(m.id).filter(x => x.status === 'late').map(x => x.month) }));
  const addMember = async ev => { const f = form(ev), el = ev.target; await run(sb.from('fund_members').insert({ fund_id: fund.id, display_name: f.n.trim() })); el.reset(); };
  const rename = async ev => { const f = form(ev); await run(sb.from('fund_members').update({ display_name: f.n.trim() }).eq('id', edit.id)); setEdit(null); };
  const delMember = async m => {
    if (!confirm('حذف «' + m.display_name + '» نهائياً؟ سيُحذف سجل أشهره، وتُلغى مدفوعاته من الرصيد.')) return;
    const { data: subs } = await sb.from('subscriptions').select('id').eq('member_id', m.id);
    const ids = (subs || []).map(x => x.id);
    if (ids.length) await sb.from('transactions').delete().in('subscription_id', ids);
    await run(sb.from('fund_members').delete().eq('id', m.id));
  };
  const setStart = async ev => { const f = form(ev); await run(sb.from('funds').update({ start_month: f.start + '-01' }).eq('id', fund.id)); reload(); };
  const addTx = (kind, extra) => ev => { const f = form(ev), el = ev.target; run(sb.from('transactions').insert({ fund_id: fund.id, kind, amount: +f.amt, description: f.desc || null, ...extra(f) })).then(() => el.reset()); };
  const delTx = id => confirm('حذف هذا القيد؟') && run(sb.from('transactions').delete().eq('id', id));
  const addInv = async ev => { const f = form(ev), el = ev.target; await run(sb.from('investments').insert({ fund_id: fund.id, name: f.n, type: f.ty, capital: +f.cap, expected_rate: +f.rate })); el.reset(); };
  const delInv = v => confirm('حذف المشروع «' + v.name + '»؟ (أرباحه المسجلة تبقى في الرصيد)') && run(sb.from('investments').delete().eq('id', v.id));
  const saveTx = t => ev => { const f = form(ev); const p = { amount: +f.amt, description: f.desc || null };
    if (t.kind === 'donation') { p.donor_name = f.name || null; p.anonymous = !!f.anon; }
    if (t.kind === 'expense') { p.beneficiary = f.ben; p.hide_beneficiary = !!f.hide; }
    run(sb.from('transactions').update(p).eq('id', t.id)); setEtx(null); };
  const saveInv = v => ev => { const f = form(ev); run(sb.from('investments').update({ name: f.n, type: f.ty, capital: +f.cap, expected_rate: +f.rate }).eq('id', v.id)); setEinv(null); };
  const Ed = (onClick) => admin ? html`<button onClick=${onClick} className="text-xs text-emerald-800 border border-emerald-200 rounded-lg px-2 py-1">✏️ تعديل</button>` : null;
  const TxForm = t => html`<form key=${t.id} onSubmit=${saveTx(t)} className="space-y-2 py-3 border-t bg-emerald-50/50 rounded-lg px-2">
    ${t.kind === 'donation' && html`<${Inp} name="name" defaultValue=${t.donor_name || ''} placeholder="اسم المتبرع (اختياري)"/>`}
    ${t.kind === 'expense' && html`<${Inp} name="ben" defaultValue=${t.beneficiary || ''} placeholder="المستفيد" required/>`}
    <${Inp} name="amt" type="number" min="0.01" step="any" defaultValue=${t.amount} required/>
    <${Inp} name="desc" defaultValue=${t.description || ''} placeholder="البيان"/>
    ${t.kind === 'donation' && html`<label className="flex gap-2 text-sm"><input type="checkbox" name="anon" defaultChecked=${!!t.anonymous}/> إظهاره كـ «فاعل خير»</label>`}
    ${t.kind === 'expense' && html`<label className="flex gap-2 text-sm"><input type="checkbox" name="hide" defaultChecked=${!!t.hide_beneficiary}/> إخفاء اسم المستفيد</label>`}
    <div className="flex gap-2"><${Btn}>حفظ التعديل<//><${Btn} type="button" cls="border" onClick=${() => setEtx(null)}>إلغاء<//></div></form>`;
  const addProfit = v => ev => { const f = form(ev), el = ev.target; run(sb.from('transactions').insert({ fund_id: fund.id, kind: 'profit', amount: +f.amt, description: 'ربح ' + v.name, investment_id: v.id })).then(() => el.reset()); };
  const wa = m => 'https://wa.me/?text=' + encodeURIComponent('السلام عليكم ' + m.display_name + ' 🌿\nتذكير لطيف بمتأخرات اشتراك «' + fund.name + '» (' + al(lateN(m.id)) + ' — ' + money(lateN(m.id) * fund.fee) + '). جزاك الله خيراً.');

  const sumK = k => tx.filter(t => t.kind === k).reduce((s, t) => s + +t.amount, 0);
  const balance = sumK('subscription') + sumK('donation') + sumK('profit') - sumK('expense');
  const totalLate = members.reduce((s, m) => s + lateN(m.id), 0);
  const byDate = k => tx.filter(t => t.kind === k).sort((a, b) => a.occurred_on < b.occurred_on ? 1 : -1);
  let hk = 0;
  const expNum = {}; tx.filter(t => t.kind === 'expense').sort((a, b) => a.occurred_on > b.occurred_on ? 1 : -1).forEach(t => { if (t.hide_beneficiary) expNum[t.id] = ++hk; });
  const Stat = ({ t, v, ic }) => html`<${Card}><div className="text-2xl">${ic}</div><div className="text-xs text-gray-500 mt-1">${t}</div><div className="font-extrabold text-xl">${money(v)}</div><//>`;
  const Del = ({ onClick }) => admin ? html`<button onClick=${onClick} className="text-xs text-red-600 border border-red-200 rounded-lg px-2 py-1">حذف</button>` : null;
  const tabs = [['mem', '👥 الأعضاء'], ['don', '🤲 أهل الخير'], ['inv', '📈 الاستثمارات'], ['exp', '🧾 المصروفات']];

  const memTab = html`<${Card}>
    <div className="flex flex-wrap items-center justify-between gap-2 mb-2"><h3 className="font-bold text-emerald-900">الأعضاء وأشهر الاشتراك</h3>
      <button onClick=${() => setLate(!late)} className=${'px-3 py-1 rounded-full text-sm border ' + (late ? 'bg-red-600 text-white border-red-600' : 'bg-white')}>🔴 المتأخرون فقط</button></div>
    ${members.filter(m => !late || lateN(m.id) > 0).map(m => { const n = lateN(m.id); return html`<div key=${m.id} className="py-3 border-t">
      ${edit && edit.id === m.id ? html`<form onSubmit=${rename} className="flex gap-2"><${Inp} name="n" defaultValue=${m.display_name} required/><${Btn}>حفظ<//><${Btn} type="button" cls="border" onClick=${() => setEdit(null)}>إلغاء<//></form>` : html`
      <div className="flex flex-wrap items-center gap-2">
        <b className="flex-1 min-w-[7rem]">${m.display_name}${m.user_id === uid ? ' (أنت)' : ''}${m.role === 'admin' ? ' 🛡️' : ''}</b>
        ${n > 0 ? html`<span className="text-xs px-2 py-1 rounded-full bg-red-600 text-white">متأخر ${al(n)} — ${money(n * fund.fee)}</span>` : html`<span className="text-xs text-emerald-700">لا متأخرات 🎉</span>`}
        <${Btn} cls="border" onClick=${() => setOpen(open === m.id ? null : m.id)}>📅 الأشهر<//>
        ${admin && html`<${Btn} cls="border" onClick=${() => setEdit({ id: m.id })}>✏️ تعديل<//>`}
        ${admin && m.user_id !== uid && html`<${Btn} cls="border text-red-600" onClick=${() => delMember(m)}>🗑 حذف<//>`}
        ${admin && n > 0 && html`<a href=${wa(m)} target="_blank" rel="noopener" className="px-3 py-1.5 rounded-lg text-sm bg-green-500 text-white">💬 تذكير</a>`}
      </div>`}
      ${open === m.id && html`<div className="mt-3"><div className="grid grid-cols-3 sm:grid-cols-4 gap-2">${by(m.id).map(r => html`<button key=${r.month} disabled=${!admin} onClick=${() => cycle(m, r)} className=${'rounded-xl p-3 text-sm ' + STY[r.status]}><div className="font-bold">${MN[+r.month.slice(5, 7) - 1]} ${r.month.slice(0, 4)}</div><div className="text-xs">${LBL[r.status]}</div></button>`)}</div>
        ${admin ? html`<p className="text-xs text-gray-500 mt-2">اضغط الشهر لتبديله: متأخر ← مدفوع ← معفي ← متأخر</p>${n > 0 && html`<${Btn} cls="mt-2 w-full bg-emerald-800 text-white" onClick=${() => payAll(m)}>سداد كل المتأخرات (${money(n * fund.fee)})<//>`}` : ''}</div>`}
    </div>`; })}
    ${late && totalLate === 0 && html`<p className="text-center text-gray-500 py-6">لا يوجد متأخرون 🎉</p>`}
    ${admin && html`<form onSubmit=${addMember} className="flex gap-2 mt-3 pt-3 border-t"><${Inp} name="n" placeholder="إضافة عضو بالاسم" required/><${Btn}>＋ إضافة<//></form>
    <form onSubmit=${setStart} className="flex gap-2 items-center mt-3"><span className="text-sm whitespace-nowrap">بداية الاحتساب</span><${Inp} name="start" type="month" defaultValue=${fund.start_month.slice(0, 7)} required/><${Btn} cls="border">حفظ<//></form>`}
  <//>`;

  const donTab = html`<${Card}><h3 className="font-bold text-emerald-900 mb-2">سجل أهل الخير</h3>
    ${byDate('donation').map(t => etx === t.id ? TxForm(t) : html`<div key=${t.id} className="flex justify-between gap-2 py-3 border-t"><div><b>${t.anonymous ? (admin && t.donor_name ? t.donor_name + ' 🔒 (للأعضاء: فاعل خير)' : 'فاعل خير') : (t.donor_name || 'فاعل خير')}</b><div className="text-xs text-gray-500">${t.description || ''} • ${t.occurred_on}</div></div><div className="flex items-center gap-2"><b className="text-emerald-700">${money(t.amount)}</b>${Ed(() => setEtx(t.id))}<${Del} onClick=${() => delTx(t.id)}/></div></div>`)}
    ${byDate('donation').length === 0 && html`<p className="text-center text-gray-500 py-4">لا توجد تبرعات بعد</p>`}
    ${admin && html`<form onSubmit=${addTx('donation', f => ({ donor_name: f.name || null, anonymous: !!f.anon }))} className="mt-3 pt-3 border-t space-y-2"><b className="text-sm">＋ تسجيل تبرع</b>
      <${Inp} name="name" placeholder="اسم المتبرع (اختياري)"/><${Inp} name="amt" type="number" min="1" step="any" placeholder="المبلغ" required/><${Inp} name="desc" placeholder="الغرض"/>
      <label className="flex gap-2 text-sm"><input type="checkbox" name="anon"/> إظهاره كـ «فاعل خير»</label><${Btn}>حفظ التبرع<//></form>`}<//>`;

  const invTab = html`<div className="space-y-3">${invs.map(v => { const p = tx.filter(t => t.kind === 'profit' && t.investment_id === v.id).reduce((s, t) => s + +t.amount, 0); return html`
    <${Card} key=${v.id}>${einv === v.id ? html`<form onSubmit=${saveInv(v)} className="space-y-2"><${Inp} name="n" defaultValue=${v.name} required/><${Inp} name="ty" defaultValue=${v.type || ''} placeholder="النوع"/><${Inp} name="cap" type="number" min="1" step="any" defaultValue=${v.capital} required/><${Inp} name="rate" type="number" min="0" max="999" step="0.1" defaultValue=${v.expected_rate || 0} required/><div className="flex gap-2"><${Btn}>حفظ التعديل<//><${Btn} type="button" cls="border" onClick=${() => setEinv(null)}>إلغاء<//></div></form>` : html`<div className="flex justify-between items-center gap-2"><b>${v.name}</b><span className="flex items-center gap-2"><span className="text-xs bg-amber-100 text-amber-800 px-2 py-1 rounded-full">${v.type || 'استثمار'}</span>${Ed(() => setEinv(v.id))}</span></div>`}
      <div className="grid grid-cols-3 gap-2 text-center mt-4 text-sm"><div><div className="text-gray-500 text-xs">رأس المال</div><b>${money(v.capital)}</b></div><div><div className="text-gray-500 text-xs">العائد المتوقع</div><b>${v.expected_rate || 0}%</b></div><div><div className="text-gray-500 text-xs">أرباح فعلية</div><b className="text-emerald-700">${money(p)}</b></div></div>
      ${tx.filter(t => t.kind === 'profit' && t.investment_id === v.id).map(t => etx === t.id ? TxForm(t) : html`<div key=${t.id} className="flex justify-between items-center text-sm py-1 border-t mt-1"><span className="text-gray-500">أرباح ${t.occurred_on}</span><span className="flex items-center gap-2"><b>${money(t.amount)}</b>${Ed(() => setEtx(t.id))}<${Del} onClick=${() => delTx(t.id)}/></span></div>`)}
      ${admin && html`<form onSubmit=${addProfit(v)} className="flex gap-2 mt-3"><${Inp} name="amt" type="number" min="1" step="any" placeholder="تسجيل ربح ($)" required/><${Btn}>＋ ربح<//><${Del} onClick=${() => delInv(v)}/></form>`}<//>`; })}
    ${invs.length === 0 && html`<p className="text-center text-gray-500 py-6">لا توجد مشاريع استثمارية بعد</p>`}
    ${admin && html`<${Card}><form onSubmit=${addInv} className="space-y-2"><b>＋ مشروع استثماري جديد</b><${Inp} name="n" placeholder="اسم المشروع" required/><${Inp} name="ty" placeholder="النوع (عقار / أسهم / تجارة)"/><${Inp} name="cap" type="number" min="1" step="any" placeholder="رأس المال" required/><${Inp} name="rate" type="number" min="0" max="999" step="0.1" placeholder="العائد المتوقع % (حتى 999)" required/><${Btn}>حفظ المشروع<//></form><//>`}</div>`;

  const expTab = html`<${Card}><h3 className="font-bold text-emerald-900 mb-2">سجل المصروفات</h3>
    ${byDate('expense').map(t => etx === t.id ? TxForm(t) : html`<div key=${t.id} className="flex justify-between gap-2 py-3 border-t"><div><b>${t.hide_beneficiary ? (admin ? (t.beneficiary || '—') + ' 🔒 (للأعضاء: حالة إنسانية سرية #' + expNum[t.id] + ')' : 'حالة إنسانية سرية #' + expNum[t.id]) : (t.beneficiary || '—')}</b><div className="text-xs text-gray-500">${t.description || ''} • ${t.occurred_on}</div></div><div className="flex items-center gap-2"><b className="text-red-600 whitespace-nowrap">- ${money(t.amount)}</b>${Ed(() => setEtx(t.id))}<${Del} onClick=${() => delTx(t.id)}/></div></div>`)}
    ${byDate('expense').length === 0 && html`<p className="text-center text-gray-500 py-4">لا توجد مصروفات بعد</p>`}
    ${admin && html`<form onSubmit=${addTx('expense', f => ({ beneficiary: f.ben, hide_beneficiary: !!f.hide }))} className="mt-3 pt-3 border-t space-y-2"><b className="text-sm">＋ تسجيل مصروف / مساعدة</b>
      <${Inp} name="ben" placeholder="المستفيد / الجهة" required/><${Inp} name="amt" type="number" min="1" step="any" placeholder="المبلغ" required/><${Inp} name="desc" placeholder="البيان" required/>
      <label className="flex gap-2 text-sm"><input type="checkbox" name="hide"/> إخفاء اسم المستفيد (حالة إنسانية سرية)</label><${Btn}>حفظ المصروف<//></form>`}<//>`;

  return html`<main className="px-3 pt-3 space-y-3">
    <div className="rounded-2xl p-6 text-white shadow" style=${{ background: 'linear-gradient(135deg,#064e3b,#047857)' }}>
      <div className="text-emerald-100 text-sm">الرصيد الحالي — ${fund.name}</div>
      <div className="text-5xl font-extrabold my-2" style=${{ color: '#fde68a' }}>${money(balance)}</div>
      <div className="text-xs text-emerald-100">الاشتراك ${money(fund.fee)} شهرياً — يستحق يوم ${fund.due_day}${admin ? html` — رمز الدعوة: <b className="select-all bg-emerald-950/40 px-2 py-0.5 rounded">${fund.invite_code}</b>` : ''}</div>
    </div>
    <div className="grid grid-cols-2 md:grid-cols-4 gap-3"><${Stat} t="إجمالي الاشتراكات" v=${sumK('subscription')} ic="💳"/><${Stat} t="تبرعات أهل الخير" v=${sumK('donation')} ic="🤲"/><${Stat} t="أرباح الاستثمار" v=${sumK('profit')} ic="📈"/><${Stat} t="المصروفات والمساعدات" v=${sumK('expense')} ic="🧾"/></div>
    ${totalLate > 0 && html`<div className="rounded-xl bg-red-50 border border-red-200 text-red-900 p-3 text-sm">🔴 إجمالي المتأخرات: ${al(totalLate)} على مستوى الأعضاء (${money(totalLate * fund.fee)})</div>`}
    ${msg && html`<p className="text-sm text-red-600">${msg}</p>`}
    <nav className="flex gap-1 overflow-x-auto">${tabs.map(([k, t]) => html`<button key=${k} onClick=${() => setTab(k)} className=${'whitespace-nowrap px-3 py-1.5 rounded-full text-sm ' + (tab === k ? 'bg-emerald-800 text-white font-bold' : 'bg-white border')}>${t}</button>`)}</nav>
    ${{ mem: memTab, don: donTab, inv: invTab, exp: expTab }[tab]}
    ${!me && html`<p className="text-xs text-gray-500">أنت لست عضواً في هذا الصندوق بعد.</p>`}
  </main>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
