  const apprGroup = async (g, ok) => {
    for (const x of g.subs) { const r = await sb.rpc('set_month', { p_member: x.member_id, p_month: x.month, p_status: ok ? 'paid' : null }); if (r.error) { setMsg('تعذّر التنفيذ: ' + r.error.message); await load(); return; } }
    setMsg(ok ? '✅ تمت الموافقة — سُجّل الدفع في اسم العضو وأُضيف للرصيد' : 'تم رفض الإشعار'); await load();
  };
  const pendBox = admin && groups.length > 0 ? html`<${Card} cls="border-orange-300 bg-orange-50"><h3 className="font-bold text-orange-900 mb-2">🟠 إشعارات دفع بانتظار موافقتك (${groups.length})</h3>
    ${groups.map(g => { const m = members.find(x => x.id === g.member_id); return html`<div key=${g.k} className="py-2 border-t border-orange-200"><b>${m ? m.display_name : 'عضو'}</b> — ${g.subs.map(x => MN[+x.month.slice(5, 7) - 1] + ' ' + x.month.slice(0, 4)).join('، ')} (${money(g.subs.length * fund.fee)})
      <div className="flex gap-2 mt-2 flex-wrap">${g.path && html`<${Btn} cls="border" onClick=${() => viewReceipt(g.path)}>🖼 عرض الإشعار<//>`}<${Btn} onClick=${() => apprGroup(g, true)}>✔ موافقة وتسجيل الدفع<//><${Btn} cls="border text-red-600" onClick=${() => apprGroup(g, false)}>✖ رفض<//></div></div>`; })}<//>` : null;
  const myBox = me && myLate.length > 0 ? html`<${Card}><div className="flex flex-wrap items-center justify-between gap-2"><div className="text-sm">عليك <b className="text-red-600">${al(myLate.length)}</b> (${money(myLate.length * fund.fee)})</div><${Btn} onClick=${() => setModal('rcpt')}>📤 رفع إشعار دفع<//></div><//>` : null;
  const myPend = me && pendSubs.some(x => x.member_id === me.id) ? html`<div className="rounded-xl bg-orange-50 border border-orange-200 text-orange-900 p-3 text-sm">🟠 إشعارك قيد المراجعة من المشرف</div>` : null;
  const claim = async () => { const el = document.getElementById('claimSel'); if (!el || !el.value) return; const { error } = await sb.rpc('claim_member', { p_member: el.value }); setMsg(error ? 'تعذّر الربط: ' + (/records/.test(error.message) ? 'لحسابك الحالي سجلات مسبقة' : error.message) : '✅ تم ربط حسابك بالاسم'); await load(); };
  const unlinked = members.filter(m => !m.user_id);
  const claimBox = me && me.role !== 'admin' && unlinked.length > 0 ? html`<${Card} cls="border-emerald-300"><b className="text-sm">🔗 هل اسمك مسجّل مسبقاً في الصندوق؟</b><p className="text-xs text-gray-500 my-1">اختر اسمك لتنتقل إليه أشهرك ومدفوعاتك المسجّلة.</p><div className="flex gap-2"><select id="claimSel" className="flex-1 border rounded-lg p-2 bg-white"><option value="">اختر اسمك…</option>${unlinked.map(m => html`<option key=${m.id} value=${m.id}>${m.display_name}</option>`)}</select><${Btn} onClick=${claim}>ربط<//></div><//>` : null;
  const rcptModal = html`<${Modal} title="رفع إشعار دفع" onClose=${() => setModal(null)}><form onSubmit=${sendReceipt} className="space-y-3">
    <p className="text-sm text-gray-600">اختر الأشهر التي يغطيها التحويل وأرفق صورة الإشعار. بعد موافقة المشرف يُسجَّل الدفع في اسمك مباشرة.</p>
    <div className="grid grid-cols-2 gap-2">${myLate.map((r, i) => html`<label key=${r.month} className="flex items-center gap-2 border rounded-lg p-2 text-sm"><input type="checkbox" name="mo" value=${r.month} defaultChecked=${i === 0}/> ${MN[+r.month.slice(5, 7) - 1]} ${r.month.slice(0, 4)}</label>`)}</div>
    <p className="text-xs text-gray-500">المبلغ المتوقع: ${money(fund.fee)} لكل شهر</p>
    <input type="file" name="file" accept="image/*" required className="w-full border rounded-lg p-2 bg-white"/>
    <button disabled=${busy} className="w-full py-2 rounded-lg bg-emerald-800 text-white font-bold disabled:opacity-50">${busy ? 'جارٍ الرفع…' : 'إرسال الإشعار'}</button></form><//>`;
  const imgModal = html`<${Modal} title="إشعار الدفع" onClose=${() => setImg(null)}><img src=${img} className="w-full rounded-lg"/><//>`;
  const KL = { subscription: 'اشتراك', donation: 'تبرع', profit: 'ربح استثمار', expense: 'مصروف' };
  const sortedTx = [...tx].sort((a, b) => a.occurred_on < b.occurred_on ? -1 : a.occurred_on > b.occurred_on ? 1 : 0);
  let rn = 0; const rows = sortedTx.map(t => { rn += t.kind === 'expense' ? -t.amount : +t.amount; return { ...t, run: rn }; });
  const mxv = Math.max(...rows.map(r => r.run), 1);
  const pts = rows.map((r, i) => (rows.length < 2 ? 250 : 10 + i * 480 / (rows.length - 1)) + ',' + (120 - Math.max(r.run, 0) / mxv * 100)).join(' ');
  const waText = '📊 تقرير «' + fund.name + '»\nالمتبقي (غير مستثمر): ' + (cash < 0 ? '-' : '') + money(cash) + '\nالمستثمر: ' + money(invested) + '\nإجمالي الأصول: ' + money(assets) + '\nالاشتراكات: ' + money(sumK('subscription')) + ' | التبرعات: ' + money(sumK('donation')) + '\nالمصروفات: ' + money(sumK('expense')) + ' | الأرباح: ' + money(sumK('profit')) + '\nالمتأخرات: ' + al(totalLate) + ' (' + money(totalLate * fund.fee) + ')';
  const repModal = html`<${Modal} id="rep" title=${'تقرير ' + fund.name + ' — ' + new Date().toISOString().slice(0, 10)} onClose=${() => setModal(null)}>
    ${stmt}
    <h4 className="font-bold mt-4 mb-1">نمو الرصيد النقدي</h4>
    <svg viewBox="0 0 500 130" className="w-full bg-emerald-50 rounded-xl"><polyline points=${pts} fill="none" stroke="#047857" strokeWidth="3"/></svg>
    <h4 className="font-bold mt-4 mb-1">المشاريع الاستثمارية</h4>
    ${invs.length === 0 ? html`<p className="text-sm text-gray-500">لا توجد مشاريع</p>` : html`<table className="w-full text-sm"><thead><tr className="bg-emerald-900 text-white"><th className="p-2">المشروع</th><th className="p-2">رأس المال</th><th className="p-2">العائد المتوقع</th><th className="p-2">أرباح فعلية</th></tr></thead><tbody>${invs.map(v => html`<tr key=${v.id} className="border-b text-center"><td className="p-2">${v.name}</td><td className="p-2">${money(v.capital)}</td><td className="p-2">${v.expected_rate || 0}%</td><td className="p-2">${money(tx.filter(t => t.kind === 'profit' && t.investment_id === v.id).reduce((s, t) => s + +t.amount, 0))}</td></tr>`)}</tbody></table>`}
    <h4 className="font-bold mt-4 mb-1">متأخرات الأعضاء</h4>
    ${totalLate === 0 ? html`<p className="text-sm text-emerald-700">لا توجد متأخرات 🎉</p>` : html`<div>${members.filter(m => lateN(m.id) > 0).map(m => html`<div key=${m.id} className="flex justify-between text-sm py-1 border-b"><span>${m.display_name}</span><span>${al(lateN(m.id))} — ${money(lateN(m.id) * fund.fee)}</span></div>`)}<div className="flex justify-between font-bold text-sm py-1"><span>الإجمالي</span><span>${money(totalLate * fund.fee)}</span></div></div>`}
    <h4 className="font-bold mt-4 mb-1">كشف الحركات</h4>
    <div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr className="bg-emerald-900 text-white"><th className="p-2">التاريخ</th><th className="p-2">البيان</th><th className="p-2">وارد</th><th className="p-2">صادر</th><th className="p-2">الرصيد</th></tr></thead><tbody>
      ${rows.map(r => html`<tr key=${r.id} className="border-b text-center"><td className="p-2">${r.occurred_on}</td><td className="p-2 text-right">${KL[r.kind] || ''}${r.kind === 'donation' ? ' — ' + (r.anonymous || !r.donor_name ? 'فاعل خير' : r.donor_name) : r.kind === 'expense' && r.hide_beneficiary ? ' — حالة سرية' : r.description ? ' — ' + r.description : ''}</td><td className="p-2 text-emerald-700">${r.kind !== 'expense' ? money(r.amount) : ''}</td><td className="p-2 text-red-600">${r.kind === 'expense' ? money(r.amount) : ''}</td><td className="p-2 font-bold">${r.run < 0 ? '-' : ''}${money(r.run)}</td></tr>`)}</tbody></table></div>
    <p className="text-xs text-gray-500 mt-2">الرصيد في الكشف يخص الحركات النقدية، ورأس المال المستثمر مخصوم في الملخص أعلاه.</p>
    <div className="flex gap-2 mt-4 noprint flex-wrap"><${Btn} onClick=${() => window.print()}>🖨️ طباعة / حفظ PDF<//><a href=${'https://wa.me/?text=' + encodeURIComponent(waText)} target="_blank" rel="noopener" className="px-3 py-1.5 rounded-lg text-sm bg-green-500 text-white">💬 مشاركة ملخص واتساب</a></div>
  <//>`;
  const tabs = [['mem', '👥 الأعضاء'], ['don', '🤲 أهل الخير'], ['inv', '📈 الاستثمارات'], ['exp', '🧾 المصروفات']];

  const memTab = html`<${Card}>
    <div className="flex flex-wrap items-center justify-between gap-2 mb-2"><h3 className="font-bold text-emerald-900">الأعضاء وأشهر الاشتراك</h3>
      <button onClick=${() => setLate(!late)} className=${'px-3 py-1 rounded-full text-sm border ' + (late ? 'bg-red-600 text-white border-red-600' : 'bg-white')}>🔴 المتأخرون فقط</button></div>
    ${members.filter(m => !late || lateN(m.id) > 0).map(m => { const n = lateN(m.id); return html`<div key=${m.id} className="py-3 border-t">
      ${edit && edit.id === m.id ? html`<form onSubmit=${rename} className="flex gap-2"><${Inp} name="n" defaultValue=${m.display_name} required/><${Btn}>حفظ<//><${Btn} type="button" cls="border" onClick=${() => setEdit(null)}>إلغاء<//></form>` : html`
      <div className="flex flex-wrap items-center gap-2">
        <b className="flex-1 min-w-[7rem]">${m.display_name}${m.user_id === uid ? ' (أنت)' : ''}${m.role === 'admin' ? ' 🛡️' : ''}</b>
        ${n > 0 ? html`<span className="text-xs px-2 py-1 rounded-full bg-red-600 text-white">متأخر ${al(n)} — ${money(n * fund.fee)}</span>` : html`<span className="text-xs text-emerald-700">لا متأخرات 🎉</span>`}
        <${Btn} cls="border" onClick=${() => setOpen(open === m.id ? null : m.id)}>📅 الأشهر<//>
        ${admin && html`<${Btn} cls="border" onClick=${() => setEdit({ id: m.id })}>✏️ تعديل<//>`}
        ${admin && m.user_id !== uid && html`<${Btn} cls="border text-red-600" onClick=${() => delMember(m)}>🗑 حذف<//>`}
        ${admin && n > 0 && html`<a href=${wa(m)} target="_blank" rel="noopener" className="px-3 py-1.5 rounded-lg text-sm bg-green-500 text-white">💬 تذكير</a>`}
      </div>`}
      ${open === m.id && html`<div className="mt-3"><div className="grid grid-cols-3 sm:grid-cols-4 gap-2">${by(m.id).map(r => html`<button key=${r.month} disabled=${!admin} onClick=${() => cycle(m, r)} className=${'rounded-xl p-3 text-sm ' + STY[r.status]}><div className="font-bold">${MN[+r.month.slice(5, 7) - 1]} ${r.month.slice(0, 4)}</div><div className="text-xs">${LBL[r.status]}</div></button>`)}</div>
        ${admin ? html`<p className="text-xs text-gray-500 mt-2">اضغط الشهر لتبديله: متأخر ← مدفوع ← معفي ← متأخر</p>${n > 0 && html`<${Btn} cls="mt-2 w-full bg-emerald-800 text-white" onClick=${() => payAll(m)}>سداد كل المتأخرات (${money(n * fund.fee)})<//>`}` : ''}</div>`}
    </div>`; })}
    ${late && totalLate === 0 && html`<p className="text-center text-gray-500 py-6">لا يوجد متأخرون 🎉</p>`}
    ${admin && html`<form onSubmit=${addMember} className="flex gap-2 mt-3 pt-3 border-t"><${Inp} name="n" placeholder="إضافة عضو بالاسم" required/><${Btn}>＋ إضافة<//></form>
    <form onSubmit=${setStart} className="flex gap-2 items-center mt-3"><span className="text-sm whitespace-nowrap">بداية الاحتساب</span><${Inp} name="start" type="month" defaultValue=${fund.start_month.slice(0, 7)} required/><${Btn} cls="border">حفظ<//></form>`}
  <//>`;

  const donTab = html`<${Card}><h3 className="font-bold text-emerald-900 mb-2">سجل أهل الخير</h3>
    ${byDate('donation').map(t => etx === t.id ? TxForm(t) : html`<div key=${t.id} className="flex justify-between gap-2 py-3 border-t"><div><b>${t.anonymous ? (admin && t.donor_name ? t.donor_name + ' 🔒 (للأعضاء: فاعل خير)' : 'فاعل خير') : (t.donor_name || 'فاعل خير')}</b><div className="text-xs text-gray-500">${t.description || ''} • ${t.occurred_on}</div></div><div className="flex items-center gap-2"><b className="text-emerald-700">${money(t.amount)}</b>${Ed(() => setEtx(t.id))}<${Del} onClick=${() => delTx(t.id)}/></div></div>`)}
    ${byDate('donation').length === 0 && html`<p className="text-center text-gray-500 py-4">لا توجد تبرعات بعد</p>`}
    ${admin && html`<form onSubmit=${addTx('donation', f => ({ donor_name: f.name || null, anonymous: !!f.anon }))} className="mt-3 pt-3 border-t space-y-2"><b className="text-sm">＋ تسجيل تبرع</b>
      <${Inp} name="name" placeholder="اسم المتبرع (اختياري)"/><${Inp} name="amt" type="number" min="1" step="any" placeholder="المبلغ" required/><${Inp} name="desc" placeholder="الغرض"/>
      <label className="flex gap-2 text-sm"><input type="checkbox" name="anon"/> إظهاره كـ «فاعل خير»</label><${Btn}>حفظ التبرع<//></form>`}<//>`;

  const invTab = html`<div className="space-y-3">${invs.map(v => { const p = tx.filter(t => t.kind === 'profit' && t.investment_id === v.id).reduce((s, t) => s + +t.amount, 0); return html`
    <${Card} key=${v.id}>${einv === v.id ? html`<form onSubmit=${saveInv(v)} className="space-y-2"><${Inp} name="n" defaultValue=${v.name} required/><${Inp} name="ty" defaultValue=${v.type || ''} placeholder="النوع"/><${Inp} name="cap" type="number" min="1" step="any" defaultValue=${v.capital} required/><${Inp} name="rate" type="number" min="0" max="999" step="0.1" defaultValue=${v.expected_rate || 0} required/><div className="flex gap-2"><${Btn}>حفظ التعديل<//><${Btn} type="button" cls="border" onClick=${() => setEinv(null)}>إلغاء<//></div></form>` : html`<div className="flex justify-between items-center gap-2"><b>${v.name}</b><span className="flex items-center gap-2"><span className="text-xs bg-amber-100 text-amber-800 px-2 py-1 rounded-full">${v.type || 'استثمار'}</span>${Ed(() => setEinv(v.id))}</span></div>`}
      <div className="grid grid-cols-3 gap-2 text-center mt-4 text-sm"><div><div className="text-gray-500 text-xs">رأس المال</div><b>${money(v.capital)}</b></div><div><div className="text-gray-500 text-xs">العائد المتوقع</div><b>${v.expected_rate || 0}%</b></div><div><div className="text-gray-500 text-xs">أرباح فعلية</div><b className="text-emerald-700">${money(p)}</b></div></div>
      ${tx.filter(t => t.kind === 'profit' && t.investment_id === v.id).map(t => etx === t.id ? TxForm(t) : html`<div key=${t.id} className="flex justify-between items-center text-sm py-1 border-t mt-1"><span className="text-gray-500">أرباح ${t.occurred_on}</span><span className="flex items-center gap-2"><b>${money(t.amount)}</b>${Ed(() => setEtx(t.id))}<${Del} onClick=${() => delTx(t.id)}/></span></div>`)}
      ${admin && html`<form onSubmit=${addProfit(v)} className="flex gap-2 mt-3"><${Inp} name="amt" type="number" min="1" step="any" placeholder="تسجيل ربح ($)" required/><${Btn}>＋ ربح<//><${Del} onClick=${() => delInv(v)}/></form>`}<//>`; })}
    ${invs.length === 0 && html`<p className="text-center text-gray-500 py-6">لا توجد مشاريع استثمارية بعد</p>`}
    ${admin && html`<${Card}><form onSubmit=${addInv} className="space-y-2"><b>＋ مشروع استثماري جديد</b><${Inp} name="n" placeholder="اسم المشروع" required/><${Inp} name="ty" placeholder="النوع (عقار / أسهم / تجارة)"/><${Inp} name="cap" type="number" min="1" step="any" placeholder="رأس المال" required/><${Inp} name="rate" type="number" min="0" max="999" step="0.1" placeholder="العائد المتوقع % (حتى 999)" required/><${Btn}>حفظ المشروع<//></form><//>`}</div>`;

  const expTab = html`<${Card}><h3 className="font-bold text-emerald-900 mb-2">سجل المصروفات</h3>
    ${byDate('expense').map(t => etx === t.id ? TxForm(t) : html`<div key=${t.id} className="flex justify-between gap-2 py-3 border-t"><div><b>${t.hide_beneficiary ? (admin ? (t.beneficiary || '—') + ' 🔒 (للأعضاء: حالة إنسانية سرية #' + expNum[t.id] + ')' : 'حالة إنسانية سرية #' + expNum[t.id]) : (t.beneficiary || '—')}</b><div className="text-xs text-gray-500">${t.description || ''} • ${t.occurred_on}</div></div><div className="flex items-center gap-2"><b className="text-red-600 whitespace-nowrap">- ${money(t.amount)}</b>${Ed(() => setEtx(t.id))}<${Del} onClick=${() => delTx(t.id)}/></div></div>`)}
    ${byDate('expense').length === 0 && html`<p className="text-center text-gray-500 py-4">لا توجد مصروفات بعد</p>`}
    ${admin && html`<form onSubmit=${addTx('expense', f => ({ beneficiary: f.ben, hide_beneficiary: !!f.hide }))} className="mt-3 pt-3 border-t space-y-2"><b className="text-sm">＋ تسجيل مصروف / مساعدة</b>
      <${Inp} name="ben" placeholder="المستفيد / الجهة" required/><${Inp} name="amt" type="number" min="1" step="any" placeholder="المبلغ" required/><${Inp} name="desc" placeholder="البيان" required/>
      <label className="flex gap-2 text-sm"><input type="checkbox" name="hide"/> إخفاء اسم المستفيد (حالة إنسانية سرية)</label><${Btn}>حفظ المصروف<//></form>`}<//>`;

  return html`<main className="px-3 pt-3 space-y-3">
    <div className="rounded-2xl p-6 text-white shadow" style=${{ background: 'linear-gradient(135deg,#064e3b,#047857)' }}>
      <div className="text-emerald-100 text-sm">المتبقي في الصندوق (غير مستثمر) — ${fund.name}</div>
      <div className="text-5xl font-extrabold my-2" style=${{ color: cash < 0 ? '#fca5a5' : '#fde68a' }}>${cash < 0 ? '-' : ''}${money(cash)}</div>
      <div className="text-xs text-emerald-100">المستثمر: ${money(invested)} • إجمالي الأصول: ${money(assets)}</div>
      <div className="text-xs text-emerald-100 mt-1">الاشتراك ${money(fund.fee)} شهرياً — يستحق يوم ${fund.due_day}${admin ? html` — رمز الدعوة: <b className="select-all bg-emerald-950/40 px-2 py-0.5 rounded">${fund.invite_code}</b>` : ''}</div>
      <button onClick=${() => setModal('rep')} className="mt-3 px-4 py-2 rounded-lg bg-amber-400 text-emerald-950 font-bold">📄 تقرير الصندوق بالتفصيل</button>
    </div>
    <${Card}><h3 className="font-bold text-emerald-900 mb-1">خطة الصندوق: من أين وإلى أين؟</h3>${stmt}<//>
    ${totalLate > 0 && html`<div className="rounded-xl bg-red-50 border border-red-200 text-red-900 p-3 text-sm">🔴 إجمالي المتأخرات: ${al(totalLate)} على مستوى الأعضاء (${money(totalLate * fund.fee)})</div>`}
    ${msg && html`<p className=${'text-sm ' + (/^✅/.test(msg) ? 'text-emerald-700' : 'text-red-600')}>${msg}</p>`}
    ${pendBox}${myPend}${myBox}${claimBox}
    <nav className="flex gap-1 overflow-x-auto">${tabs.map(([k, t]) => html`<button key=${k} onClick=${() => setTab(k)} className=${'whitespace-nowrap px-3 py-1.5 rounded-full text-sm ' + (tab === k ? 'bg-emerald-800 text-white font-bold' : 'bg-white border')}>${t}</button>`)}</nav>
    ${{ mem: memTab, don: donTab, inv: invTab, exp: expTab }[tab]}
    ${!me && html`<p className="text-xs text-gray-500">أنت لست عضواً في هذا الصندوق بعد.</p>`}
    ${modal === 'rep' && repModal}${modal === 'rcpt' && me && rcptModal}${img && imgModal}
  </main>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Boundary, null, React.createElement(App)));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
